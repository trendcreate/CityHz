<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>CityHz - ラジオ局運営</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="boot">
  <div class="boot-inner">
    <h1>City<span>Hz</span></h1>
    <p class="tagline">ラジオ局運営シミュレーション</p>
    <div class="boot-tabs">
      <button class="boot-tab sel" data-boot="new">新規開局</button>
      <button class="boot-tab" data-boot="continue">続きから</button>
    </div>

    <div class="boot-form" id="bootNew">
      <label>局名 <input id="bootName" value="シティ放送" maxlength="12"></label>
      <label>コールサイン <input id="bootCall" value="JOZZ-FM" maxlength="10"></label>
      <label>周波数 <input id="bootFreq" type="number" value="79.5" step="0.1" min="76" max="94"> MHz</label>

      <div class="boot-label">モード</div>
      <div class="boot-modes">
        <button class="mode-btn selected" data-mode="normal">
          <b>通常</b><span>経営に集中。災害は起きない。</span>
        </button>
        <button class="mode-btn" data-mode="disaster">
          <b>災害</b><span>地震・台風。報道責任と法令遵守が問われる。</span>
        </button>
      </div>

      <div class="boot-label">難易度</div>
      <div class="boot-diffs" id="bootDiffs"></div>
      <div class="diff-desc" id="bootDiffDesc"></div>

      <div class="boot-opts">
        <label class="chk"><input type="checkbox" id="bootTut" checked> チュートリアルを表示する</label>
        <label class="chk"><input type="checkbox" id="bootAudio" checked> 音を鳴らす（BGM・効果音）</label>
      </div>
      <button id="bootStart">開局する</button>
    </div>

    <div class="boot-form hidden" id="bootContinue">
      <div class="boot-label">保存データ</div>
      <div id="bootSaves"></div>
    </div>
  </div>
</div>

<div id="app" class="hidden">

  <header id="topbar">
    <div class="brand">City<span>Hz</span></div>
    <div class="station-id">
      <b id="hdrName">-</b>
      <span id="hdrCall">-</span>
    </div>
    <div class="stats">
      <div class="stat"><label>資金</label><b id="stMoney">-</b></div>
      <div class="stat"><label>聴取率</label><b id="stRating">-</b></div>
      <div class="stat"><label>信頼度</label><b id="stTrust">-</b></div>
      <div class="stat"><label>士気</label><b id="stMorale">-</b></div>
      <div class="stat"><label>カバー人口</label><b id="stPop">-</b></div>
      <div class="stat" title="サイマル配信の聴取動向"><label>配信指数</label><b id="stSimul">-</b></div>
    </div>
    <div class="clock">
      <div id="clkDate">-</div>
      <div id="clkTime" class="onair">-</div>
    </div>
    <div class="speed">
      <button data-speed="0">II</button>
      <button data-speed="1" class="sel">▶</button>
      <button data-speed="2">▶▶</button>
      <button data-speed="4">▶▶▶</button>
    </div>
    <div class="audio-ctl">
      <button id="btnBgm" class="on" title="BGM">♪</button>
      <button id="btnSfx" class="on" title="効果音">🔔</button>
    </div>
  </header>

  <div id="main">
    <nav id="sidebar">
      <button class="nav sel" data-view="city">市街地</button>
      <button class="nav" data-view="studio">社屋</button>
      <button class="nav" data-view="sched">編成</button>
      <button class="nav" data-view="staff">人事</button>
      <button class="nav" data-view="sales">営業</button>
      <button class="nav" data-view="network">系列</button>
      <button class="nav" data-view="legal">免許</button>
      <button class="nav" data-view="finance">財務</button>
      <button class="nav" data-view="glossary">用語辞典</button>
      <div class="nav-spacer"></div>
      <button class="nav small" id="btnTut">ガイド</button>
      <button class="nav small" id="btnSettings" title="災害モードのON/OFFなど">設定</button>
      <button class="nav small" id="btnSave">保存</button>
      <button class="nav small" id="btnLoad">読込</button>
    </nav>

    <section id="stage">
      <!-- map views -->
      <div class="view" id="view-city">
        <div class="map-wrap">
          <canvas id="cityCanvas" width="1000" height="640"></canvas>
          <div class="palette" id="cityPalette"></div>
          <div class="maplegend" id="cityLegend"></div>
        </div>
      </div>
      <div class="view hidden" id="view-studio">
        <div class="map-wrap">
          <canvas id="studioCanvas" width="1000" height="640"></canvas>
          <div class="palette" id="studioPalette"></div>
          <div class="maplegend" id="studioLegend"></div>
        </div>
      </div>
      <!-- panel views -->
      <div class="view hidden panel" id="view-sched"></div>
      <div class="view hidden panel" id="view-staff"></div>
      <div class="view hidden panel" id="view-sales"></div>
      <div class="view hidden panel" id="view-network"></div>
      <div class="view hidden panel" id="view-legal"></div>
      <div class="view hidden panel" id="view-finance"></div>
      <div class="view hidden panel" id="view-glossary"></div>
    </section>

    <aside id="rightbar">
      <div class="onair-box">
        <div class="onair-label">ON AIR</div>
        <div id="onairTitle">－</div>
        <div id="onairDj" class="sub">－</div>
        <div class="meter"><i id="onairMeter"></i></div>
        <div id="onairShare" class="sub">－</div>
        <div id="onairMood" class="sub"></div>
      </div>
      <div id="tutbox" class="hidden"></div>
      <div class="log-head">局内無線 / 報道フロア</div>
      <div id="log"></div>
    </aside>
  </div>
</div>

<div id="modal" class="hidden">
  <div class="modal-box">
    <div class="modal-head" id="modalHead">-</div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-opts" id="modalOpts"></div>
  </div>
</div>

<div id="toasts"></div>

<script src="js/data.js"></script>
<script src="js/glossary.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/map.js"></script>
<script src="js/ui.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/main.js"></script>
</body>
</html>
